name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # Backend Build and Test
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: cd backend && ./mvnw clean compile -B

      - name: Run Unit Tests
        run: cd backend && ./mvnw test -B

      - name: Run Integration Tests
        run: cd backend && ./mvnw verify -B -DskipUnitTests

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/**/target/surefire-reports/
          retention-days: 7

  # Code Quality Checks
  backend-quality:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Check Code Formatting (Spotless)
        run: cd backend && ./mvnw spotless:check -B
        continue-on-error: true

      - name: Run Checkstyle
        run: cd backend && ./mvnw checkstyle:check -B
        continue-on-error: true

      - name: Run SpotBugs
        run: cd backend && ./mvnw spotbugs:check -B
        continue-on-error: true

      - name: Generate JaCoCo Coverage Report
        run: cd backend && ./mvnw jacoco:report -B

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/**/target/site/jacoco/
          retention-days: 7

  # SonarQube Analysis
  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          cd backend && ./mvnw clean verify sonar:sonar \
            -Dsonar.projectKey=vet-clinic \
            -Dsonar.projectName="Vet Clinic" \
            -B
        if: env.SONAR_TOKEN != ''

      - name: SonarQube not configured
        if: env.SONAR_TOKEN == ''
        run: echo "SonarQube analysis skipped - SONAR_TOKEN not configured"

  # Frontend Build (when frontend exists)
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Linter
        run: cd frontend && npm run lint

      - name: Run Tests
        run: cd frontend && npm test -- --passWithNoTests

      - name: Build
        run: cd frontend && npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: cd backend && ./mvnw org.owasp:dependency-check-maven:check -B
        continue-on-error: true

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/**/target/dependency-check-report.html
          retention-days: 7

  # Build Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [backend-build, backend-quality, security-scan]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.backend-build.result }}" == "failure" ]; then
            echo "Backend build failed!"
            exit 1
          fi
          echo "All checks completed successfully!"
