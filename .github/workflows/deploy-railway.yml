name: Deploy to Railway

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy-keycloak:
    name: Deploy Keycloak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Keycloak
        run: |
          cd keycloak
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service link keycloak
          railway up --detach

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-keycloak
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend
        run: |
          cd backend
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service link backend
          railway up --detach

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend
        run: |
          cd frontend
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          railway service link frontend
          railway up --detach

  notify:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs: [deploy-keycloak, deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-backend.result }}" == "failure" ] || [ "${{ needs.deploy-frontend.result }}" == "failure" ] || [ "${{ needs.deploy-keycloak.result }}" == "failure" ]; then
            echo "❌ Deployment failed!"
            exit 1
          fi
          echo "✅ All deployments completed!"
          echo ""
          echo "🔐 Keycloak: https://keycloak-production-0590.up.railway.app"
          echo "🚀 Backend:  https://backend-production-0857.up.railway.app"
          echo "🌐 Frontend: https://frontend-production-6b31.up.railway.app"
