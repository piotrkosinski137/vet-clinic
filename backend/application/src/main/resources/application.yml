spring:
  application:
    name: vet-clinic

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:vetclinic}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/vetclinic}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/vetclinic/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Veterinary Clinic Management System
    version: '@project.version@'

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: ${CORS_MAX_AGE:3600}

# Keycloak configuration for token endpoint
keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:vetclinic}
  client-id: ${KEYCLOAK_CLIENT_ID:vetclinic-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:vetclinic-secret}

logging:
  level:
    com.vetclinic: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/vetclinic
    username: vetclinic
    password: ${DB_PASSWORD:vetclinic}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  h2:
    console:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/vetclinic
          jwk-set-uri: http://keycloak:8180/realms/vetclinic/protocol/openid-connect/certs

keycloak:
  auth-server-url: http://keycloak:8180
  realm: ${KEYCLOAK_REALM:vetclinic}
  client-id: ${KEYCLOAK_CLIENT_ID:vetclinic-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:vetclinic-secret}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
# PostgreSQL profile (for local dev with Docker DB)
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/vetclinic
    username: vetclinic
    password: ${DB_PASSWORD:vetclinic}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  h2:
    console:
      enabled: false
