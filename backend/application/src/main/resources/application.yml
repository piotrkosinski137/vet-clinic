spring:
  application:
    name: vet-clinic

  # Default: PostgreSQL (Docker for local dev)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/vetclinic}
    username: ${SPRING_DATASOURCE_USERNAME:vetclinic}
    password: ${SPRING_DATASOURCE_PASSWORD:vetclinic}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/vetclinic}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/vetclinic/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

info:
  app:
    name: ${spring.application.name}
    description: Veterinary Clinic Management System
    version: '@project.version@'

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true
  max-age: ${CORS_MAX_AGE:3600}

# Keycloak configuration for token endpoint
keycloak:
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:vetclinic}
  client-id: ${KEYCLOAK_CLIENT_ID:vetclinic-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:vetclinic-secret}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

logging:
  level:
    com.vetclinic: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

---
# Docker profile (for running inside Docker network)
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/vetclinic
    username: vetclinic
    password: ${DB_PASSWORD:vetclinic}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/vetclinic
          jwk-set-uri: http://keycloak:8180/realms/vetclinic/protocol/openid-connect/certs

keycloak:
  auth-server-url: http://keycloak:8180
