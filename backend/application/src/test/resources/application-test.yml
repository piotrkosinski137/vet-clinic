spring:
  # Datasource properties are dynamically configured by AbstractIntegrationTest
  # using @DynamicPropertySource to connect to Testcontainers PostgreSQL

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  main:
    allow-bean-definition-overriding: true

logging:
  level:
    com.vetclinic: DEBUG
