# Development Docker Compose with hot-reload support
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
version: '3.8'

services:
  postgres:
    # Use base configuration, just ensure it's always started
    profiles: []

  keycloak:
    # Use base configuration
    profiles: []

  # Backend with hot-reload (mount source for live recompilation)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development
    container_name: vetclinic-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vetclinic
      SPRING_DATASOURCE_USERNAME: vetclinic
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-vetclinic}
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/vetclinic
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/vetclinic/protocol/openid-connect/certs
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
    ports:
      - "8080:8080"
      - "35729:35729"  # LiveReload port
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    working_dir: /app
    command: ["./mvnw", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  # Frontend with hot-reload
  frontend-dev:
    image: node:20-alpine
    container_name: vetclinic-frontend-dev
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
      VITE_KEYCLOAK_URL: http://localhost:8180
      VITE_KEYCLOAK_REALM: vetclinic
      VITE_KEYCLOAK_CLIENT_ID: vetclinic-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    profiles:
      - dev

volumes:
  maven_cache:
  node_modules:
